# One-click setup on Render: Blueprints > New Blueprint Instance > pick this repository.
# No plan is set, so Render uses its default paid instance (needed for the disk and to stay awake).
services:
  - type: web
    name: lettertide
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: node --no-warnings=ExperimentalWarning server.js
    healthCheckPath: /healthz
    disk:
      name: letters
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DB_PATH
        value: /var/data/lettertide.db
      - key: BASE_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
